<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Hannah's Catering Service</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- Elegant font -->

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================
       BASIC PAGE
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;
      position: relative;
      overflow: hidden;
    }


    /* =========================
       BACKGROUND IMAGES
       ========================= */

    .background {
      position: fixed;

      inset: 0;

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

      opacity: 0;

      transition:
        opacity 1.5s ease-in-out;

      z-index: -3;
    }


    .background-one {
      background-image:
        url("https://images.pexels.com/photos/262978/pexels-photo-262978.jpeg?auto=compress&cs=tinysrgb&w=1600");

      opacity: 1;
    }


    .background-two {
      background-image:
        url("https://images.pexels.com/photos/21856021/pexels-photo-21856021.jpeg");
    }


    .background-three {
      background-image:
        url("https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1600");
    }


    /* =========================
       DARK BACKGROUND OVERLAY
       ========================= */

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.38);

      z-index: -2;

      pointer-events: none;
    }


    /* =========================
       HAMBURGER MENU
       ========================= */

    .menu-container {
      position: absolute;

      top: 20px;
      left: 20px;

      z-index: 20;
    }


    .menu-button {
      width: 55px;
      height: 55px;

      border: none;

      border-radius: 10px;

      background:
        rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 30px;

      cursor: pointer;

      transition: 0.3s ease;
    }


    .menu-button:hover {
      background:
        #f0c674;

      color: #222;

      transform:
        scale(1.05);
    }


    /* =========================
       DROPDOWN MENU
       ========================= */

    .dropdown-menu {
      position: absolute;

      top: 65px;
      left: 0;

      width: 220px;

      background:
        rgba(0, 0, 0, 0.9);

      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.5);

      opacity: 0;

      visibility: hidden;

      transform:
        translateY(-10px);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        visibility 0.3s ease;
    }


    .dropdown-menu.show {
      opacity: 1;

      visibility: visible;

      transform:
        translateY(0);
    }


    /* =========================
       MENU LINKS
       ========================= */

    .dropdown-menu a {
      display: block;

      padding: 16px 20px;

      color: white;

      text-decoration: none;

      font-size: 1rem;

      font-weight: bold;

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.1);

      transition:
        0.25s ease;
    }


    .dropdown-menu a:last-child {
      border-bottom: none;
    }


    .dropdown-menu a:hover {
      background:
        #f0c674;

      color: #222;

      padding-left: 28px;
    }


    /* =========================
       CHEF IMAGE
       ========================= */

    .chef-image {
      position: absolute;

      top: 20px;
      right: 20px;

      width: 240px;
      height: 240px;

      border-radius: 50%;

      overflow: hidden;

      border: 4px solid white;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.5);

      z-index: 10;
    }


    .chef-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* =========================
       HERO SECTION
       ========================= */

    .hero {
      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding:
        80px 20px;

      position: relative;

      z-index: 1;
    }


    .hero-content {
      max-width: 900px;

      opacity: 1;

      transform:
        translateY(0);

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;
    }

    /* =========================
       TEXT TRANSITION
       ========================= */

    .hero-content.changing {
      opacity: 0;

      transform:
        translateY(20px);
    }


    /* =========================
       HANNAH'S CATERING SERVICE
       COLOURFUL BUBBLE
       ========================= */

    .hero-subtitle {

      display: inline-block;

      font-family:
        Georgia, serif;

      font-size:
        1.3rem;

      font-weight:
        bold;

      letter-spacing:
        3px;

      text-transform:
        uppercase;

      color:
        #ffffff;

      background:
        linear-gradient(
          135deg,
          #d4a017,
          #f0c674,
          #c98b2e
        );

      padding:
        14px 28px;

      border-radius:
        50px;

      margin:
        0 0 30px;

      border:
        2px solid
        rgba(255, 255, 255, 0.8);

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.5),

        0 0 20px
        rgba(240, 198, 116, 0.35);

      text-shadow:
        0 2px 4px
        rgba(0, 0, 0, 0.5);

      animation:
        bubbleFloat
        3s
        ease-in-out
        infinite;
    }


    /* =========================
       BUBBLE ANIMATION
       ========================= */

    @keyframes bubbleFloat {

      0% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-5px);
      }

      100% {
        transform:
          translateY(0);
      }

    }


    /* =========================
       MAIN CHANGING TITLE
       ========================= */

    #heroTitle {

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(2.5rem, 5vw, 5rem);

      font-weight:
        400;

      font-style:
        normal;

      line-height:
        1;

      color:
        white;

      margin:
        0 0 30px;

      text-shadow:
        0 3px 10px
        rgba(0, 0, 0, 0.85);
    }


    /* =========================
       DESCRIPTION
       ========================= */

    .hero-description {

      font-family:
        Arial, sans-serif;

      font-size:
        1.2rem;

      font-weight:
        normal;

      line-height:
        1.7;

      max-width:
        650px;

      margin:
        0 auto 20px;

      color:
        rgba(255, 255, 255, 0.95);

      text-shadow:
        0 2px 6px
        rgba(0, 0, 0, 0.8);
    }


    /* =========================
       EXTRA TEXT
       ========================= */

    .hero-extra {

      font-family:
        Georgia, serif;

      font-size:
        1rem;

      font-style:
        italic;

      line-height:
        1.6;

      max-width:
        600px;

      margin:
        20px auto 0;

      color:
        rgba(255, 255, 255, 0.85);

      text-shadow:
        0 2px 5px
        rgba(0, 0, 0, 0.8);
    }


    /* =========================
       MOBILE DESIGN
       ========================= */

    @media (max-width: 700px) {

      .menu-container {
        top: 15px;
        left: 15px;
      }


      .menu-button {
        width: 50px;
        height: 50px;

        font-size: 27px;
      }


      .dropdown-menu {
        top: 60px;

        width: 200px;
      }


      .chef-image {
        width: 90px;
        height: 90px;

        top: 15px;
        right: 15px;
      }


      .hero {
        padding:
          150px
          20px
          60px;
      }


      .hero-subtitle {

        font-size:
          0.85rem;

        letter-spacing:
          2px;

        padding:
          12px 20px;

        margin-bottom:
          25px;
      }


      #heroTitle {

        font-size:
          clamp(
            1.8rem,
            8vw,
            2.5rem
          );

        margin-bottom:
          25px;
      }


      .hero-description {

        font-size:
          1rem;

        line-height:
          1.6;
      }


      .hero-extra {

        font-size:
          0.9rem;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       BACKGROUND IMAGES
       ========================= -->

  <div
    class="background background-one">
  </div>


  <div
    class="background background-two">
  </div>


  <div
    class="background background-three">
  </div>


  <!-- =========================
       HAMBURGER MENU
       ========================= -->

  <div class="menu-container">


    <button
      class="menu-button"
      onclick="toggleMenu()"
      aria-label="Open navigation menu"
    >
      ☰
    </button>


    <div
      class="dropdown-menu"
      id="dropdownMenu"
    >

      <a href="catering.html">
        Catering
      </a>


      <a href="menu.html">
        Menu
      </a>


      <a href="contact.html">
        Get in Touch
      </a>


      <a href="meet-chef.html">
        Meet The Chef
      </a>

    </div>

  </div>


  <!-- =========================
       CHEF IMAGE
       ========================= -->

  <div class="chef-image">

    <img
      src="images/meet-chef.jpg"
      alt="Hannah, Chef"
    >

  </div>


  <!-- =========================
       HERO SECTION
       ========================= -->

  <main class="hero">


    <div
      class="hero-content"
      id="heroContent"
    >


      <!-- STATIC BRAND NAME -->

      <p class="hero-subtitle">
        Hannah's Catering Service
      </p>


      <!-- CHANGING TITLE -->

      <h1 id="heroTitle">

        Delicious Food.<br>
        Beautifully Served.

      </h1>


      <!-- CHANGING DESCRIPTION -->

      <p
        class="hero-description"
        id="heroDescription"
      >

        Premium catering for weddings,
        corporate events, private dining
        and special occasions.

      </p>


      <!-- CHANGING EXTRA TEXT -->

      <p
        class="hero-extra"
        id="heroExtra"
      >

        Creating memorable experiences
        with exceptional food,
        beautifully presented.

      </p>


    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>


    /* =========================
       HAMBURGER MENU
       ========================= */

    function toggleMenu() {

      const menu =
        document.getElementById(
          "dropdownMenu"
        );

      menu.classList.toggle(
        "show"
      );

    }


    /* =========================
       CLOSE MENU WHEN CLICKING
       OUTSIDE
       ========================= */

    document.addEventListener(
      "click",
      function(event) {

        const menuContainer =
          document.querySelector(
            ".menu-container"
          );

        const menu =
          document.getElementById(
            "dropdownMenu"
          );


        if (
          !menuContainer.contains(
            event.target
          )
        ) {

          menu.classList.remove(
            "show"
          );

        }

      }
    );


    /* =========================
       SLIDE CONTENT
       ========================= */

    const slides = [

      {

        title:
          "Delicious Food.<br>Beautifully Served.",

        description:
          "Premium catering for Airbnb stays, weddings, corporate events, private dining, and special occasions.",

        extra:
          "Creating memorable experiences with exceptional food, beautifully presented, using Hannah’s catering services."

      },


      {

        title:
          "Make Your Special Day<br>Unforgettable.",

        description:
          "Beautiful food and professional catering designed especially for your wedding or celebration.",

        extra:
          "From intimate gatherings to grand celebrations, we help make every moment special."

      },


      {

        title:
          "Great Food for<br>Great Events.",

        description:
          "Professional catering for weddings, meetings, conferences, business lunches, private and corporate occasions.",

        extra:
          "Fresh, beautifully presented food that keeps your guests impressed and your event running smoothly."

      }

    ];


    /* =========================
       BACKGROUND ELEMENTS
       ========================= */

    const backgrounds = [

      document.querySelector(
        ".background-one"
      ),

      document.querySelector(
        ".background-two"
      ),

      document.querySelector(
        ".background-three"
      )

    ];


    /* =========================
       HERO ELEMENTS
       ========================= */

    const heroContent =
      document.getElementById(
        "heroContent"
      );


    const heroTitle =
      document.getElementById(
        "heroTitle"
      );


    const heroDescription =
      document.getElementById(
        "heroDescription"
      );


    const heroExtra =
      document.getElementById(
        "heroExtra"
      );


    /* =========================
       CURRENT SLIDE
       ========================= */

    let currentSlide = 0;


    /* =========================
       CHANGE SLIDE
       ========================= */

    function changeSlide() {


      /* Fade text out */

      heroContent.classList.add(
        "changing"
      );


      /* Fade current image out */

      backgrounds[currentSlide]
        .style.opacity = "0";


      /* Move to next slide */

      currentSlide =
        (currentSlide + 1)
        % slides.length;


      /* Fade new image in */

      backgrounds[currentSlide]
        .style.opacity = "1";


      /*
        Wait for text to fade out
        before changing the text.
      */

      setTimeout(
        function() {


          heroTitle.innerHTML =
            slides[currentSlide].title;


          heroDescription.innerHTML =
            slides[currentSlide].description;


          heroExtra.innerHTML =
            slides[currentSlide].extra;


          /* Fade new text in */

          heroContent.classList.remove(
            "changing"
          );


        },
        1200
      );

    }


    /* =========================
       START SLIDESHOW
       ========================= */

    setInterval(
      changeSlide,
      5000
    );


  </script>


</body>

</html>
